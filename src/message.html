<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Landing Page</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="messagestyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->
    <nav class="navbar">
        <div class="navbar-content">

            <div class="nav-left">
                <i class="fa-brands fa-linkedin linkedin-logo"></i>

                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search">
                </div>
            </div>

            <div class="nav-right">
                <a href="index.html" class="nav-item">
                    <i class="fa-solid fa-house"></i>
                    <span>Home</span>
                </a>

                <div class="nav-item">
                    <i class="fa-solid fa-user-group"></i>
                    <span>My Network</span>
                </div>

                <div class="nav-item">
                    <i class="fa-solid fa-briefcase"></i>
                    <span>Jobs</span>
                </div>

                <div class="nav-item">
                    <i class="fa-solid fa-comment"></i>
                    <span>Messaging</span>
                </div>

                <div class="nav-item">
                    <i class="fa-solid fa-bell"></i>
                    <span>Notifications</span>
                </div>
                <div class="nav-item">
                    <img src="img.jpeg" class="nav-profile" alt="">
                    <span>Me</span>
                </div>

            </div>
        </div>
    </nav>
   <div class="messages-page">

    <!-- Left Side -->
    <div class="chat-list">

        <h2>Messaging</h2>

        <div class="message-search">
            <input type="text" placeholder="Search messages">
        </div>

        <div class="chat active">
            <img src="img.jpeg">
            <div>
                <h4>Prateek Dwivedi</h4>
                <p>Hey! How are you?</p>
            </div>
        </div>

        <div class="chat">
            <img src="img.jpeg">
            <div>
                <h4>Microsoft</h4>
                <p>Welcome to Microsoft.</p>
            </div>
        </div>

    </div>

    <!-- Right Side -->
    <div class="chat-window">

        <div class="chat-header">
            <img src="img.jpeg">
            <div>
                <h3>Prateek Dwivedi</h3>
                <p>Active now</p>
            </div>
        </div>

        <div class="messages">
            <div class="received">Hello 👋</div>
            <div class="sent">Hi! How are you?</div>
        </div>

        <div class="message-box">
            <input type="text" placeholder="Write a message...">
            <button>
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
